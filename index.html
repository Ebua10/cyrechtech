  <head>
    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cyrech Tech" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cyrech Tech | Web Development, Mobile Apps &amp; Branding in Cameroon</title>
    <meta name="description" content="Cyrech Tech builds websites, mobile apps, e-commerce solutions, UI/UX and branding for businesses in Cameroon and across Africa." />

    <meta property="og:title" content="Cyrech Tech | Web Development, Mobile Apps &amp; Branding in Cameroon" />
    <meta property="og:description" content="Web development, mobile apps, branding and e-commerce solutions." />
    <meta property="og:url" content="https://cyrechtech.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cyrechtech.com/cyrech-tech-logo.png" />
    <meta name="theme-color" content="#131313" />
    <style>
      #initial-site-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #131313;
        color: #e5e2e1;
        font-family: system-ui, sans-serif;
      }
      #initial-site-loader .loader-content { width: min(100% - 32px, 640px); text-align: center; }
      #initial-site-loader .loader-scene { position: relative; width: min(100%, 720px); height: 190px; }
      #initial-site-loader .loader-computer {
        position: absolute;
        top: 50%;
        width: clamp(88px, 25vw, 190px);
        height: clamp(64px, 18vw, 128px);
        padding: 8px;
        border: 1px solid rgba(195, 244, 0, .45);
        border-radius: 12px;
        background: #1c1b1b;
        box-shadow: 0 0 40px rgba(195, 244, 0, .12);
        animation: initial-computer-in .8s cubic-bezier(.2,.8,.2,1) both;
      }
      #initial-site-loader .loader-computer::before {
        content: attr(data-letter);
        display: grid;
        place-items: center;
        height: 100%;
        border: 1px solid #353534;
        border-radius: 8px;
        color: #c3f400;
        font-size: clamp(30px, 8vw, 48px);
        font-weight: 700;
      }
      #initial-site-loader .loader-left { left: 0; transform: perspective(800px) rotateY(-14deg) translateY(-50%); }
      #initial-site-loader .loader-right { right: 0; transform: perspective(800px) rotateY(14deg) translateY(-50%); animation-delay: .12s; }
      #initial-site-loader .loader-person {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #c3f400;
        box-shadow: 0 0 24px rgba(195, 244, 0, .55);
        animation: initial-person-spin .8s linear infinite;
      }
      #initial-site-loader .loader-person::before {
        content: "";
        position: absolute;
        left: 5px;
        top: 18px;
        width: 6px;
        height: 20px;
        border-radius: 5px;
        background: #c3f400;
        box-shadow: -9px 4px 0 -1px #c3f400, 9px 4px 0 -1px #c3f400, -4px 25px 0 -1px #c3f400, 4px 25px 0 -1px #c3f400;
      }
      #initial-site-loader .loader-brand { margin-top: 14px; color: #c3f400; font-weight: 700; letter-spacing: .08em; }
      #initial-site-loader .loader-welcome { margin: 10px 0 0; font-size: 14px; font-weight: 600; animation: initial-text-in .45s .25s both; }
      #initial-site-loader .loader-tagline { margin: 6px 0 0; color: #c4c9ac; font-size: 12px; animation: initial-text-in .45s .65s both; }
      @keyframes initial-computer-in { from { opacity: 0; translate: 0 calc(-50% + 20px); scale: .88; } to { opacity: 1; translate: 0 -50%; scale: 1; } }
      @keyframes initial-person-spin { from { transform: translate(-50%, -50%) rotateY(0deg); } to { transform: translate(-50%, -50%) rotateY(360deg); } }
      @keyframes initial-text-in { from { opacity: 0; translate: 0 10px; scale: .9; } to { opacity: 1; translate: 0 0; scale: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #initial-site-loader *, #initial-site-loader *::before { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>

  <body class="bg-background text-foreground">
    <div id="root">
      <div id="initial-site-loader" role="status" aria-label="Cyrech Tech page loading">
        <div class="loader-content">
          <div class="loader-scene" aria-hidden="true">
            <div class="loader-computer loader-left" data-letter="C"></div>
            <div class="loader-computer loader-right" data-letter="T"></div>
            <div class="loader-person"></div>
          </div>
          <div class="loader-brand">CYRECH TECH</div>
          <p class="loader-welcome">Welcome to Cyrech Tech</p>
          <p class="loader-tagline">Beautiful digital experiences. Creative minds. Technology you can trust.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
